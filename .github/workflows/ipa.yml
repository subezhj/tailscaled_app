# Build an installable IPA entirely on GitHub-hosted macOS — no local Mac
# needed. This is the "build your own Heeler+Tailscale IPA in the cloud"
# workflow the project relies on for sideloading (TrollStore / Sideloadly /
# AltStore / Feather) or ad-hoc dev installs.
#
# What it does:
#   1. Check out the repo + libtailscale submodule.
#   2. Build TailscaleKit.xcframework from the submodule (Go engine +
#      Swift bindings) via `make ios-fat`.
#   3. Stage the framework where the local SPM package expects it.
#   4. Regenerate the Xcode project (project.yml is source of truth).
#   5. Archive + export an IPA.
#
# Signing: two modes, chosen with the `signing` workflow input.
#   - `unsigned` (default): no certs anywhere. xcodebuild archives with
#     CODE_SIGNING_ALLOWED=NO and the workflow extracts a raw .app into an
#     unsigned .ipa that a signing tool (e.g. Sideloadly, or a TrollStore
#     remount tool) can process. The iOS App Store / dev-required entitlements
#     (keychain access groups, app groups) will need to be signed on-device
#     later, so this is best for TrollStore-style installs or when you only
#     need the .app bundle.
#   - `development`: uses an Apple Developer cert + provisioning profile
#     supplied as GitHub secrets. Set SIGNING_CERT_BASE64 and
#     SIGNING_PROFILE_BASE64, then the export signs with `development` method
#     (dev-signed for your registered devices). Requires an Apple Developer
#     account ($99/yr). This produces a directly-installable IPA.
#
# Trigger: workflow_dispatch (manual) — press "Run workflow" in the Actions tab.

name: Build IPA

on:
  workflow_dispatch:
    inputs:
      signing:
        description: "Signing mode (unsigned = sideload later, development = dev-signed IPA)"
        required: true
        default: "unsigned"
        type: choice
        options:
          - unsigned
          - development

permissions:
  contents: read

jobs:
  build-ipa:
    name: Build IPA (${{ github.event.inputs.signing || 'unsigned' }})
    runs-on: macos-26
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install Go (for libtailscale)
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"

      - name: Show toolchain
        run: |
          go version
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      # ---- Build the embedded Tailscale engine (libtailscale) ----
      - name: Build TailscaleKit.xcframework (Go + iOS SDK)
        run: |
          cd ThirdParty/libtailscale/swift
          make ios-fat

      - name: Stage TailscaleKit.xcframework for SPM
        run: |
          mkdir -p Packages/TailscaleKit/Artifacts
          cp -R ThirdParty/libtailscale/swift/build/Build/Products/Release-iphonefat/TailscaleKit.xcframework \
                Packages/TailscaleKit/Artifacts/
          ls -la Packages/TailscaleKit/Artifacts/TailscaleKit.xcframework

      # ---- Regenerate the Xcode project from project.yml (XcodeGen) ----
      - name: Install XcodeGen
        run: brew install xcodegen

      # Read the MARKETING_VERSION from project.yml. The BUILD number is the
      # workflow run_number, which auto-increments on every trigger — so each
      # build has a unique ID both in the artifact name and in the app's
      # CFBundleVersion (CURRENT_PROJECT_VERSION is patched below before the
      # Xcode project is regenerated).
      - name: Read version
        id: version
        run: |
          MARKETING=$(awk -F'"' '/MARKETING_VERSION/ {print $2; exit}' project.yml)
          echo "marketing=${MARKETING:-0.0.0}" >> "$GITHUB_OUTPUT"
          echo "runnumber=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          # Filename-safe version: Heeler-IPA-v0.1.3-b42.ipa
          echo "artifact_version=${MARKETING:-0.0.0}-b${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      # Patch the source-level build number so the app's About screen and
      # the IPA metadata carry the same incremented ID. Must run BEFORE
      # xcodegen generate so the regenerated project picks it up.
      - name: Patch CURRENT_PROJECT_VERSION
        run: |
          sed -i '' \
            "s/CURRENT_PROJECT_VERSION: \"[0-9]*\"/CURRENT_PROJECT_VERSION: \"${{ github.run_number }}\"/" \
            project.yml
          awk '/CURRENT_PROJECT_VERSION/' project.yml

      - name: Generate Xcode project
        run: xcodegen generate

      # ---- Archive ----
      - name: Archive (unsigned)
        if: github.event.inputs.signing != 'development'
        run: |
          xcodebuild archive \
            -project Heeler.xcodeproj -scheme Heeler \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Heeler.xcarchive \
            -allowProvisioningUpdates \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

      - name: Import signing certificate + profile
        if: github.event.inputs.signing == 'development'
        run: |
          set -euo pipefail
          CERT_B64="${{ secrets.SIGNING_CERT_BASE64 }}"
          PROFILE_B64="${{ secrets.SIGNING_PROFILE_BASE64 }}"
          if [ -z "$CERT_B64" ] || [ -z "$PROFILE_B64" ]; then
            echo "::error::development signing selected but SIGNING_CERT_BASE64 / SIGNING_PROFILE_BASE64 secrets are not set"
            exit 1
          fi
          echo "$CERT_B64" | base64 --decode > /tmp/dist.p12
          echo "$PROFILE_B64" | base64 --decode > /tmp/profile.mobileprovision
          security create-keychain -p "$RANDOM$RANDOM" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$RANDOM$RANDOM" build.keychain
          security import /tmp/dist.p12 -k build.keychain -P "${{ secrets.SIGNING_CERT_PASSWORD }}" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$RANDOM$RANDOM" build.keychain
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp /tmp/profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Archive (development signed)
        if: github.event.inputs.signing == 'development'
        run: |
          xcodebuild archive \
            -project Heeler.xcodeproj -scheme Heeler \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Heeler.xcarchive \
            -allowProvisioningUpdates \
            -derivedDataPath build/DerivedData

      # ---- Export ----
      - name: Export IPA (unsigned .app)
        if: github.event.inputs.signing != 'development'
        run: |
          # No provisioning profile to export against, so just package the
          # unsigned .app into an .ipa that sideload tools accept.
          mkdir -p build/ipa/Payload
          cp -R build/Heeler.xcarchive/Products/Applications/Heeler.app build/ipa/Payload/
          cd build/ipa && zip -qry "../Heeler-IPA-v${{ steps.version.outputs.artifact_version }}.ipa" Payload
          cd ../..
          ls -la build/Heeler-IPA-v*.ipa

      - name: Export IPA (development signed)
        if: github.event.inputs.signing == 'development'
        run: |
          cat > build/ExportOptions.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>development</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>stripSwiftSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath build/Heeler.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/ipa \
            -allowProvisioningUpdates
          mv build/ipa/Heeler.ipa "build/Heeler-IPA-v${{ steps.version.outputs.artifact_version }}.ipa" 2>/dev/null || true

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Heeler-IPA
          path: build/Heeler-IPA-v*.ipa
          if-no-files-found: error
          retention-days: 30
