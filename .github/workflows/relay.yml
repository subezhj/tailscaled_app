# Deploy the stateless Push Relay (relay/) to Cloudflare Workers.
#
# The relay forwards Agent Notifications and Live Activity pushes to APNs and
# is only reachable over HTTPS — an unreachable or misconfigured relay makes
# every Host's notify-hook fail with a 400 from the relay, while the Live
# Activity hook stops producing updates. It is deployed independently of the
# landing page, so relay-only changes never spend a macOS runner.
#
# Requires three repository secrets (see relay/README.md for how to mint them):
#
#   CLOUDFLARE_API_TOKEN    scoped to Workers Scripts:Edit on the account that
#                           owns the bybee.dev zone (same account as relay/)
#   CLOUDFLARE_ACCOUNT_ID   the Cloudflare account id
#   APNS_KEY_P8             the .p8 PEM used to sign the APNs provider JWT
#
# wrangler comes from landing/package-lock.json so the deploying binary is
# pinned like the landing page's; the relay itself has zero dependencies.

name: Relay

on:
  push:
    branches: [main]
    paths:
      - relay/**
      - .github/workflows/relay.yml

# One in-flight run per ref; a new push cancels the previous run.
concurrency:
  group: relay-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy push relay
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: landing/package-lock.json

      - name: Install wrangler
        run: npm install --no-save wrangler@4.129.0

      - name: Run relay tests
        run: npm test

      - name: Set APNs signing key
        run: echo "${{ secrets.APNS_KEY_P8 }}" | npx wrangler secret put APNS_KEY_P8
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"

      - name: Deploy to Cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
